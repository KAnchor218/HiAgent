# HiAgentEng config: engineering-equivalent HiAgent with summary cache and audit logs.
run:
  max_num_steps: 30
  wandb: True
  project_name: eval-hiagent-eng
  baseline_dir: data/baseline_results
  log_path: ${PROJECT_PATH}/results/test

agent:
  name: HiAgentEng
  memory_size: 100
  need_goal: True
  use_parser: True

llm:
  xiaoai-gpt4-turbo: &gpt4_turbo
    name: gpt
    engine: gpt-4-turbo
    context_length: 8192
    max_tokens: 100
    use_azure: False
    temperature: 0.
    top_p: 1
    retry_delays: 20
    max_retry_iters: 100
    stop: "\n\n"
    use_parser: False
  gpt-4-turbo:
    <<: *gpt4_turbo
  xiaoai-gpt4o: &gpt4o
    name: gpt
    engine: gpt-4o
    context_length: 8192
    max_tokens: 100
    use_azure: False
    temperature: 0.
    top_p: 1
    retry_delays: 20
    max_retry_iters: 100
    stop: "\n\n"
    use_parser: False
  gpt-4o:
    <<: *gpt4o

env:
  jericho:
    name: jericho
    game_name:
      [
        "905",
        "acorncourt",
        "afflicted",
        "balances",
        "dragon",
        "jewel",
        "library",
        "omniquest",
        "reverb",
        "snacktime",
        "zenon",
        "zork1",
        "zork2",
        "zork3",
        "detective",
        "night",
        "pentari",
        "weapon",
        "huntdark",
        "loose",
      ]
    game_dir: ${PROJECT_PATH}/data/jericho/z-machine-games-master/jericho-game-suite
    label_path: ${PROJECT_PATH}/data/jericho/test.jsonl
    check_actions: "check valid actions"
    check_inventory: "inventory"
    init_prompt_path: ${PROJECT_PATH}/agentboard/prompts/ContextAgent/jericho.json
